<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carrito | INFYMSA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* por si algún contenedor hereda pointer-events:none */
    #list, #list * { pointer-events: auto; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  <!-- Barra superior -->
  <header class="w-full bg-gradient-to-r from-blue-600 to-blue-800 text-white">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/PG21.0/proyecto/catalogo.html" class="text-white/90 hover:text-white">← Seguir comprando</a>
      <h1 class="text-xl sm:text-2xl font-extrabold">Tu carrito</h1>
      <div></div>
    </div>
  </header>

  <!-- Banda debug (se puede quitar luego) -->
  <div id="dbg" class="hidden max-w-7xl mx-auto mt-3 px-4 py-2 rounded bg-yellow-50 text-yellow-800 text-sm"></div>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <!-- Vacío -->
    <div id="empty" class="hidden text-center py-16">
      <p class="text-gray-600 mb-4">Tu carrito está vacío.</p>
      <a href="/PG21.0/proyecto/catalogo.html" class="inline-flex px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">
        Ir al catálogo
      </a>
    </div>

    <!-- Carrito -->
    <div id="cart" class="grid gap-6 lg:grid-cols-[2fr_1fr]">
      <!-- Lista -->
      <section id="list" class="space-y-4"></section>

      <!-- Resumen -->
      <aside class="h-max bg-white rounded-2xl shadow p-4">
        <h2 class="font-semibold mb-3">Resumen</h2>
        <div class="flex justify-between text-sm mb-1">
          <span>Subtotal</span><span id="subtotal">Q 0.00</span>
        </div>
        <div class="flex justify-between text-sm mb-3">
          <span>Envío</span><span id="envio">Q 0.00</span>
        </div>
        <hr class="my-3">
        <div class="flex justify-between font-bold text-lg">
          <span>Total</span><span id="total">Q 0.00</span>
        </div>
        <button id="checkout" class="mt-4 w-full rounded-xl bg-emerald-600 text-white py-2.5 hover:bg-emerald-700">
          Finalizar compra
        </button>
      </aside>
    </div>
  </main>

  <!-- Script AUTÓNOMO del carrito (no depende de cart.js) -->
  <script>
  (function(){
    const CART_KEY = 'cart_v1';
    const SHIPPING_COST = 40; // Q40.00

    // ===== Debug helpers (Opción 1: no-op) =====
    // Mantengo el div #dbg por si luego quieres reactivar, pero la función no hace nada.
    function dbg(){ /* no-op: sin UI ni logs */ }

    // ---- Storage helpers ----
    function getCart(){ try{ return JSON.parse(localStorage.getItem(CART_KEY))||[] }catch{ return [] } }
    function setCart(items){
      localStorage.setItem(CART_KEY, JSON.stringify(items));
      document.dispatchEvent(new Event('cart:updated'));
    }

    // ---- API mínima ----
    function updateQty(id, qty){
      const cart = getCart();
      const i = cart.findIndex(p=>String(p.id)===String(id));
      if(i>=0){
        cart[i].qty = Math.max(1, Number(qty)||1);
        setCart(cart);
      }else{
        dbg('updateQty: no se encontró el id', id);
      }
    }
    function removeItem(id){
      const before = getCart().length;
      setCart(getCart().filter(p=>String(p.id)!==String(id)));
      const after = getCart().length;
      if (after === before) dbg('removeItem: no se encontró el id', id);
    }
    function formatQ(n){ return 'Q' + (Number(n)||0).toLocaleString('es-GT',{minimumFractionDigits:2, maximumFractionDigits:2}); }

    // ---- Nodos ----
    const els = {
      cartWrap: document.getElementById('cart'),
      empty: document.getElementById('empty'),
      list: document.getElementById('list'),
      subtotal: document.getElementById('subtotal'),
      envio: document.getElementById('envio'),
      total: document.getElementById('total'),
      checkout: document.getElementById('checkout'),
    };
    Object.entries(els).forEach(([k,v])=>{ if(!v) console.warn('[carrito] Falta nodo', k); });

    // ---- UI ----
    function itemTpl(p){
      return `
        <article class="bg-white rounded-2xl shadow p-4 flex gap-4" data-id="${p.id}">
          <div class="w-24 h-24 bg-gray-100 rounded-xl overflow-hidden flex items-center justify-center">
            ${p.imagen ? `<img src="${p.imagen}" alt="${p.nombre}" class="w-full h-full object-cover">`
                        : `<span class="text-xs text-gray-400">Sin imagen</span>`}
          </div>
          <div class="flex-1">
            <h3 class="font-semibold">${p.nombre}</h3>
            <p class="text-sm text-gray-500">${p.descripcion || ''}</p>
            <p class="mt-1 font-medium">${formatQ(p.precio)}</p>

            <div class="mt-3 flex items-center gap-2">
              <button class="qty-dec px-3 py-1 rounded-lg border relative z-10" data-id="${p.id}" type="button">−</button>
              <input type="number" min="1" class="qty-input w-16 text-center border rounded-lg py-1"
                     value="${p.qty||1}" data-id="${p.id}">
              <button class="qty-inc px-3 py-1 rounded-lg border relative z-10" data-id="${p.id}" type="button">+</button>

              <button class="ml-auto text-red-600 hover:text-red-700 remove relative z-10" data-id="${p.id}" type="button">
                Quitar
              </button>
            </div>
          </div>
        </article>
      `;
    }

    function updateTotals(items){
      const subtotal = items.reduce((a,p)=> a + (Number(p.precio)||0) * (p.qty||1), 0);
      const envio    = items.length ? SHIPPING_COST : 0;
      const total    = subtotal + envio;
      els.subtotal.textContent = formatQ(subtotal);
      els.envio.textContent    = formatQ(envio);
      els.total.textContent    = formatQ(total);
    }

    function render(){
      const items = getCart();

      if (!items.length){
        els.cartWrap.classList.add('hidden');
        els.empty.classList.remove('hidden');
        els.list.innerHTML = '';
        updateTotals([]);
        return;
      }
      els.cartWrap.classList.remove('hidden');
      els.empty.classList.add('hidden');
      els.list.innerHTML = items.map(itemTpl).join('');
      updateTotals(items);
    }

    // ---- Eventos (delegación global, con prevención) ----
    document.addEventListener('click', (e)=>{
      const dec = e.target.closest('.qty-dec');
      const inc = e.target.closest('.qty-inc');
      const rm  = e.target.closest('.remove');
      const go  = e.target.closest('#checkout');

      if (dec){
        e.preventDefault(); e.stopPropagation();
        const id = dec.dataset.id;
        const it = getCart().find(x=>String(x.id)===String(id));
        const next = (it?.qty||1) - 1;
        updateQty(id, next);
        render();
        dbg('dec', {id, next});
        return;
      }
      if (inc){
        e.preventDefault(); e.stopPropagation();
        const id = inc.dataset.id;
        const it = getCart().find(x=>String(x.id)===String(id));
        const next = (it?.qty||1) + 1;
        updateQty(id, next);
        render();
        dbg('inc', {id, next});
        return;
      }
      if (rm){
        e.preventDefault(); e.stopPropagation();
        const id = rm.dataset.id;
        removeItem(id);
        render();
        dbg('remove', {id});
        return;
      }
      if (go){
        e.preventDefault(); e.stopPropagation();
        // Guardar preview y seguir al checkout
        sessionStorage.setItem('order_preview', JSON.stringify({
          items: getCart(),
          totals: els.total.textContent
        }));
        location.href = '/PG21.0/proyecto/checkout.html';
        return;
      }
    }, true);

    document.addEventListener('input', (e)=>{
      const input = e.target.closest('.qty-input');
      if (!input) return;
      const id  = input.dataset.id;
      const val = Math.max(1, Number(input.value)||1);
      updateQty(id, val);
      render();
      dbg('input qty', {id, val});
    }, true);

    // ---- Init ----
    render();
    document.addEventListener('cart:updated', render);
  })();
  </script>
</body>
</html>
