<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout | INFYMSA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-gray-800">

  <!-- Header -->
  <header class="w-full bg-gradient-to-r from-blue-600 to-blue-800 text-white">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/PG21.0/proyecto/carrito.html" class="text-white/90 hover:text-white">← Volver al carrito</a>
      <h1 class="text-xl sm:text-2xl font-extrabold">Datos de envío y contacto</h1>
      <div></div>
    </div>
  </header>

  <!-- ===== MAIN con fondo azul degradado, contenido centrado ===== -->
  <main class="min-h-screen bg-gradient-to-b from-blue-600 to-blue-800 flex items-center justify-center px-4 py-10">

    <!-- Panel -->
    <div class="max-w-6xl w-full bg-white/90 rounded-3xl shadow-xl ring-1 ring-black/5 p-6 sm:p-8">
      <div class="grid gap-6 lg:grid-cols-[2fr_1fr]">
        
        <!-- Formulario -->
        <section class="bg-white rounded-2xl shadow p-6">
          <form id="checkout-form" class="space-y-5" novalidate>
            <div class="grid gap-4 sm:grid-cols-2">
              <div>
                <label class="block text-sm font-medium mb-1" for="nombre">Nombre completo</label>
                <input id="nombre" name="nombre" type="text" required class="w-full rounded-lg border px-3 py-2 outline-none focus:ring-2 focus:ring-blue-600"/>
              </div>

              <div>
                <label class="block text-sm font-medium mb-1" for="telefono">Teléfono</label>
                <input id="telefono" name="telefono" type="tel" required class="w-full rounded-lg border px-3 py-2 outline-none focus:ring-2 focus:ring-blue-600"/>
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium mb-1" for="correo">Correo electrónico</label>
              <input id="correo" name="correo" type="email" required class="w-full rounded-lg border px-3 py-2 outline-none focus:ring-2 focus:ring-blue-600"/>
            </div>

            <div>
              <label class="block text-sm font-medium mb-1" for="direccion">Dirección</label>
              <input id="direccion" name="direccion" type="text" required class="w-full rounded-lg border px-3 py-2 outline-none focus:ring-2 focus:ring-blue-600"/>
            </div>

            <div class="grid gap-4 sm:grid-cols-2">
              <div>
                <label class="block text-sm font-medium mb-1" for="ciudad">Ciudad</label>
                <input id="ciudad" name="ciudad" type="text" required class="w-full rounded-lg border px-3 py-2 outline-none focus:ring-2 focus:ring-blue-600"/>
              </div>
              <div>
                <label class="block text-sm font-medium mb-1" for="departamento">Departamento</label>
                <input id="departamento" name="departamento" type="text" required class="w-full rounded-lg border px-3 py-2 outline-none focus:ring-2 focus:ring-blue-600"/>
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium mb-1" for="notas">Notas (opcional)</label>
              <textarea id="notas" name="notas" rows="3" class="w-full rounded-lg border px-3 py-2 outline-none focus:ring-2 focus:ring-blue-600"></textarea>
            </div>

            <div class="pt-3 flex justify-center">
              <button type="submit" class="w-full sm:w-auto rounded-xl bg-emerald-600 text-white px-5 py-2.5 hover:bg-emerald-700 shadow-sm">
                Continuar con el pago
              </button>
            </div>
          </form>
        </section>

        <!-- Resumen -->
        <aside class="h-max bg-white rounded-2xl shadow p-4 lg:sticky lg:top-6">
          <h2 class="font-semibold mb-3">Resumen</h2>
          <div class="text-sm text-gray-600 mb-2">Verifica tus datos antes de continuar.</div>
          <hr class="my-3">
          <p class="text-sm text-gray-500">Tu carrito se conservará hasta completar el pago.</p>
        </aside>

      </div>
    </div>
  </main>

  <!-- Script (sin limpiar carrito) -->
  <script>
    (function(){
      const ROOT = '/PG21.0/proyecto';
      const CART_KEY = 'cart_v1';
      const CHECKOUT_KEY = 'checkout_v1';

      function getCart(){ try{ return JSON.parse(localStorage.getItem(CART_KEY))||[] }catch{ return [] } }

      const form = document.getElementById('checkout-form');

      form?.addEventListener('submit', (e)=>{
        e.preventDefault();

        const requiredIds = ['nombre','telefono','correo','direccion','ciudad','departamento'];
        for (const id of requiredIds){
          const el = document.getElementById(id);
          if (!el || !el.value.trim()){
            el?.focus();
            alert('Por favor completa: ' + id);
            return;
          }
        }

        const fd = new FormData(form);
        const data = Object.fromEntries(fd.entries());
        localStorage.setItem(CHECKOUT_KEY, JSON.stringify(data));

        sessionStorage.setItem('order_preview', JSON.stringify({
          items: getCart(),
          createdAt: Date.now()
        }));

        location.href = `${ROOT}/pago.html`;
      });
    })();
  </script>

</body>
</html>
