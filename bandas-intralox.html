<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bandas Intralox | INFYMSA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .nav-item:hover{transform:translateY(-1px);transition:all .3s ease}
    .badge-desc { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Header simple (puedes usar tu header completo si prefieres) -->
  <header class="w-full bg-white shadow">
    <div class="bg-gradient-to-r from-blue-600 to-blue-800">
      <div class="max-w-7xl mx-auto px-4 py-4 text-white flex items-center justify-between">
        <a href="catalogo.html" class="font-semibold">← Catálogo</a>
        <h1 class="text-xl md:text-2xl font-extrabold">Bandas Intralox</h1>
        <span></span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <!-- Info / breadcrumb opcional -->
    <div class="flex items-center justify-between gap-4 mb-6">
      <p id="resultsInfo" class="text-sm text-gray-600">Cargando…</p>
      <div class="hidden md:flex items-center gap-2">
        <label class="text-sm text-gray-600" for="q">Buscar</label>
        <input id="q" type="search" placeholder="bandas, serie 900, curva…"
               class="rounded-lg border-gray-300 focus:ring-blue-600 focus:border-blue-600 text-sm">
      </div>
    </div>

    <!-- Grid de productos -->
    <section id="grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      <!-- Tarjetas renderizadas por JS -->
    </section>
  </main>

  <!-- Template de tarjeta -->
  <template id="cardTpl">
    <article class="bg-white rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition overflow-hidden">
      <!-- Imagen -->
      <div class="relative aspect-[4/3] bg-gray-100">
        <img data-el="img" class="absolute inset-0 w-full h-full object-cover" alt="" />
      </div>

      <!-- Botón Agregar debajo de la imagen -->
      <div class="px-4">
        <button class="mt-3 inline-flex items-center gap-2 rounded-full bg-gray-900 hover:bg-black text-white px-4 py-2 text-sm font-semibold">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5 21h14M10 21a1 1 0 11-2 0 1 1 0 012 0zm8 0a1 1 0 11-2 0 1 1 0 012 0z" />
          </svg>
          Agregar
        </button>
      </div>

      <!-- Precio + descuento -->
      <div class="px-4 mt-3 flex items-end gap-3">
        <span data-el="badge" class="hidden badge-desc text-xs font-bold bg-red-500 text-white px-2 py-0.5 rounded">-00%</span>
        <div>
          <div data-el="price" class="text-xl font-extrabold text-gray-900">Q0.00</div>
          <div class="text-xs text-gray-400">
            <span data-el="oldPrice" class="line-through"></span>
          </div>
        </div>
      </div>
      <div class="px-4 text-[11px] text-gray-500">Válido hasta el <span data-el="validUntil">—</span></div>

      <!-- Marca + nombre -->
      <div class="px-4 pb-4 pt-2">
        <a data-el="brand" href="javascript:void(0)" class="text-sm text-blue-700 font-semibold hover:underline">Intralox</a>
        <h3 data-el="name" class="mt-1 text-[15px] leading-snug text-gray-800 line-clamp-2">
          Nombre de producto
        </h3>
        <div class="mt-2 text-[11px] text-gray-500">Vendedor: <span class="font-medium text-gray-700">INFYMSA</span></div>
      </div>
    </article>
  </template>

  

  <script src="/PG21.0/proyecto/js/cart.js"></script>
<script src="/PG21.0/proyecto/js/bandas-intralox.js"></script>


</body>
</html>
