<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Engranajes | INFYMSA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <!-- Barra -->
  <header class="w-full bg-gradient-to-r from-blue-600 to-blue-800 text-white">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/PG21.0/proyecto/catalogo.html" class="text-white/90 hover:text-white">← Catálogo</a>
      <h1 class="text-xl sm:text-2xl font-extrabold">Engranajes</h1>

      <!-- Buscador -->
      <div class="w-72 max-w-full">
        <label for="q" class="sr-only">Buscar</label>
        <input id="q" type="search" placeholder="Buscar engranajes, coronas, piñones…"
               class="w-full px-3 py-2 rounded-lg bg-white/95 text-gray-800 shadow focus:outline-none">
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <p id="resultsInfo" class="text-sm text-gray-500 mb-4">0 resultado(s)</p>
    <section id="grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></section>
  </main>

  <!-- Template de card -->
  <template id="cardTpl">
    <article class="bg-white rounded-2xl shadow overflow-hidden" data-id="" data-nombre="" data-precio="" data-imagen="" data-descripcion="">
      <img data-el="img" src="" alt="" class="w-full h-56 object-cover">
      <div class="p-4">
        <div class="flex items-center justify-between">
          <span class="text-lg font-bold" data-el="price">Q0.00</span>
          <button class="btn-add-cart inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-blue-600 text-white hover:bg-blue-700"
                  data-id="" data-nombre="" data-precio="" data-imagen="" data-descripcion="">
            Agregar
          </button>
        </div>

        <p class="mt-2 text-sm text-gray-600" data-el="brand">Intralox</p>
        <p class="text-gray-900 font-semibold" data-el="name">Nombre</p>
        <p class="text-sm text-gray-600 mt-1" data-el="desc"></p>
      </div>
    </article>
  </template>

  <script type="module" src="/PG21.0/proyecto/js/engranajes.js"></script>
</body>
</html>
